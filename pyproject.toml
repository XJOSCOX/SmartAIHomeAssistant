[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jake-home-assistant"
version = "0.1.0"
description = "Privacy-first, local-first smart home perception foundations for Jake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
tracking = ["numpy>=2,<3"]
vision = ["opencv-python>=4.13,<5", "numpy>=2,<3"]
detection = ["opencv-python>=4.13,<5", "numpy>=2,<3", "ultralytics==8.4.141"]

appearance = ["openvino==2026.3.1", "opencv-python>=4.13,<5", "numpy>=2,<3"]
identity = ["cryptography==50.0.1", "keyring==25.7.0"]

[project.scripts]
jake-camera = "jake.cli:main"
jake-enroll-resident = "jake.enroll_cli:main"
jake-visitors = "jake.visitor_cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "mypy>=1.15,<2", "ruff>=0.11,<1", "cryptography==50.0.1", "keyring==25.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
