# Non-secret application configuration.
[pipeline]
camera_id = "front-door"
min_person_confidence = 0.5

[camera]
# Local camera index only; URLs and video files are not accepted.
device = 0

[detector]
# Download weights explicitly first; relative paths are relative to the working directory.
model = "models/yolo11n.pt"
device = "cpu"
image_size = 640
# Uses pipeline.min_person_confidence as the single confidence threshold.

[tracking]
assignment = "hungarian"
min_iou = 0.3
# Legacy IoU / kalman-baseline only; stabilized Kalman ignores this value.
max_missed_frames = 10
confirmation_hits = 3
max_missed_seconds = 1.5
max_center_distance = 0.15
iou_weight = 0.6
distance_weight = 0.4

[tracking.kalman]
process_noise_position = 0.0001
process_noise_velocity = 0.001
measurement_noise = 0.001
initial_position_variance = 0.01
initial_velocity_variance = 1.0

[events]
# Emitted only for visible confirmed tracks; no catch-up bursts after missed frames.
present_interval_seconds = 5.0

[tracking.appearance]
# Opt in only after installing the appearance extra and local XML/BIN model pair.
enabled = false
model = "models/person-reidentification-retail-0287.xml"
weight = 0.35
min_similarity = 0.45
ema_alpha = 0.8
max_embedding_age_seconds = 5.0

[tracking.reid]
# Applies to appearance-enabled Kalman. Window is total time since last observation.
enabled = true
window_seconds = 5.0
min_similarity = 0.65
max_center_distance = 0.30
appearance_weight = 0.7
motion_weight = 0.3
